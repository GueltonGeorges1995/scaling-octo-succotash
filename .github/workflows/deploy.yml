name: Publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Une seule publication à la fois : la plus récente remplace celle en attente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:navigateur
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Dépend du build et des tests : s'ils échouent, rien n'est déployé et la dernière version valide reste en ligne.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
